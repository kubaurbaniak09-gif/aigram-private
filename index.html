<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIgram Private V3</title>
<style>
:root{--bg:#0b0d10;--card:#14171c;--card2:#1b2027;--fg:#f4f5f7;--muted:#9097a3;--line:#282e38;--blue:#5ea6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}
button{cursor:pointer}.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:76px}.top{position:sticky;top:0;z-index:20;background:#0b0d10ee;backdrop-filter:blur(12px);padding:14px 14px 9px;border-bottom:1px solid var(--line);display:flex;align-items:center}.brand{font-size:24px;font-weight:800}.sp{flex:1}.icon{border:0;background:none;color:var(--fg);font-size:22px;padding:7px}
.page{display:none;padding:10px}.page.active{display:block}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#101318f5;border-top:1px solid var(--line);display:flex;justify-content:center}.navin{width:min(620px,100%);display:flex}.nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 2px 8px;font-size:18px}.nav button.active{color:var(--fg)}.nav small{display:block;font-size:10px;margin-top:2px}
.stories{display:flex;gap:12px;overflow:auto;padding:8px 2px 14px}.story{width:70px;flex:0 0 70px;text-align:center}.story img{width:62px;height:62px;border-radius:50%;object-fit:cover;border:2px solid #e75ca8;padding:2px}.story span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}.panel{padding:12px}.head,.row,.person,.profileline{display:flex;align-items:center;gap:10px}.head{padding:10px}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover}.who{display:flex;flex-direction:column;min-width:0}.who small,.muted{color:var(--muted)}.postimg{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}.actions{display:flex;align-items:center;padding:6px 8px}.actions button{background:none;border:0;color:var(--fg);font-size:22px;padding:5px 8px}.body{padding:0 12px 12px;line-height:1.45}.caption{margin:5px 0 8px}.comment{margin:7px 0}.reply{margin:5px 0 0 18px;padding-left:8px;border-left:2px solid var(--line)}.commentbox{display:flex;gap:7px;margin-top:10px}.commentbox input,.search,input,textarea{min-width:0;flex:1;background:#0d1014;color:var(--fg);border:1px solid var(--line);border-radius:11px;padding:10px}.primary,.secondary{border:0;border-radius:11px;padding:9px 12px}.primary{background:var(--blue);color:#07111e;font-weight:700}.secondary{background:#242a33;color:var(--fg)}.tiny{font-size:11px;padding:4px 7px}.badge{font-size:10px;background:#282e38;padding:3px 6px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid img{width:100%;aspect-ratio:1;object-fit:cover}.people{display:grid;gap:8px}.person{padding:10px;background:var(--card);border:1px solid var(--line);border-radius:14px}.followbtn{margin-left:auto}.search{width:100%;margin:0 0 10px}.stats{display:flex;justify-content:space-around;text-align:center;margin:14px 0}.stat b{font-size:18px}.profileline img{width:76px;height:76px;border-radius:50%;object-fit:cover}.chatlog{height:55vh;overflow:auto;background:#0d1014;border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0}.bubble{max-width:82%;padding:9px 11px;border-radius:14px;margin:7px 0}.bubble.me{margin-left:auto;background:#27558f}.bubble.bot{background:#202630}.modal,.onboard{position:fixed;inset:0;background:#000b;z-index:100;display:none;padding:12px;overflow:auto}.modal.show,.onboard.show{display:block}.modalbox,.onbox{max-width:580px;margin:4vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.onboard{background:var(--bg);z-index:200}.onbox{margin:8vh auto}.onbox input,.onbox textarea{width:100%;display:block;margin:7px 0}.toast{display:none;position:fixed;bottom:82px;left:50%;transform:translateX(-50%);z-index:300;background:#eef2f6;color:#111;padding:9px 13px;border-radius:10px}
.explore{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.explore img{width:100%;aspect-ratio:1;object-fit:cover}.storyview{width:100%;max-height:68vh;object-fit:contain;border-radius:12px;margin:10px 0}.insights{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:var(--card2);padding:12px;border-radius:12px}.metric b{font-size:20px;display:block}.threadCount{color:var(--muted);font-size:12px}.suggest{display:flex;overflow:auto;gap:9px}.suggest .panel{min-width:160px;text-align:center}.suggest img{width:62px;height:62px;border-radius:50%;object-fit:cover}
</style></head>
<body>
<div class="app">
<header class="top"><div class="brand">AIgram</div><span class="sp"></span><button class="icon" onclick="refreshFeed(true)">↻</button><button class="icon" onclick="switchPage('create')">＋</button></header>
<main>
<section id="home" class="page active"><div id="stories" class="stories"></div><div id="suggestions"></div><div id="feed"></div></section>
<section id="explore" class="page"><input id="exploreSearch" class="search" placeholder="Szukaj osób, miast, hashtagów..." oninput="renderExplore()"><div id="exploreGrid" class="explore"></div></section>
<section id="create" class="page"><div class="panel"><h3>Nowy post</h3><input id="postImage" type="file" accept="image/*"><textarea id="postCaption" rows="4" placeholder="Napisz opis... #podróże @ktoś"></textarea><button class="primary" onclick="publishPost()">Opublikuj</button></div><div class="panel"><h3>Nowa relacja</h3><input id="storyImage" type="file" accept="image/*"><textarea id="storyCaption" rows="2" placeholder="Tekst relacji..."></textarea><button class="primary" onclick="publishStory()">Dodaj relację</button></div></section>
<section id="messages" class="page"><input id="peopleSearch" class="search" placeholder="Szukaj rozmowy lub osoby..." oninput="renderMessages()"><div id="messageList"></div><h3>Poznaj ludzi</h3><div id="peopleList" class="people"></div></section>
<section id="activity" class="page"><h3>Aktywność</h3><div id="activityList"></div></section>
<section id="profile" class="page"><div id="profileHead" class="panel"></div><div id="insights" class="panel"></div><h3>Twoje posty</h3><div id="myGrid" class="grid"></div></section>
</main></div>
<nav class="nav"><div class="navin">
<button class="active" data-page="home">⌂<small>Home</small></button><button data-page="explore">⌕<small>Explore</small></button><button data-page="create">＋<small>Dodaj</small></button><button data-page="messages">✉<small>DM</small></button><button data-page="profile">◎<small>Profil</small></button>
</div></nav>
<div id="modal" class="modal"><div id="modalBox" class="modalbox"></div></div><div id="toast" class="toast"></div>
<div id="onboard" class="onboard"><div class="onbox"><h2>Stwórz swój profil</h2><p class="muted">Ty jesteś jedyną prawdziwą osobą w tej sieci.</p><input id="obName" placeholder="Imię / nazwa"><input id="obHandle" placeholder="Login"><input id="obCity" placeholder="Miasto"><textarea id="obBio" rows="3" placeholder="Bio"></textarea><input id="obAvatar" type="file" accept="image/*"><button class="primary" style="width:100%" onclick="finishOnboarding()">Wejdź do AIgram</button></div></div>
<script>
const DB='AIgramV3DB',STORE='s',KEY='main';
const FIRST=['Lena','Mila','Noah','Aya','Zoe','Nina','Leo','Sofia','Maya','Emil','Clara','Luca','Emma','Max','Nora','Theo','Julia','Oskar','Amelia','Finn','Elsa','Miko','Laura','Alex','Sara','Kai','Mia','Ben','Lina','Eli','Olivia','Daniel','Hanna','Victor','Elena','Adam','Iga','Klara','Anton','Marta'];
const CITIES=['Berlin','Warszawa','Amsterdam','London','Tokyo','Barcelona','Rome','Prague','Vienna','Paris','Lisbon','Oslo','Makarska','Wrocław','Split','Zagreb'];
const BIOS=['travel • coffee • photos','city life & late nights','fitness • food • trips','photography and small adventures','music • friends • spontaneous plans','ocean, mountains, good people'];
const CAPS=['Poranek bez pośpiechu.','Jeszcze jedno z dzisiaj.','Ten widok zostaje w głowie.','Weekend dobrze się zaczyna.','Bez większego planu.','Trochę miasta, trochę chaosu.','Dzisiaj tylko dobry vibe.','W drodze gdzieś dalej.','Wieczór był lepszy niż plan.','Potrzebowałem/am takiego dnia.'];
let state,feedOrder=[],feedLimit=20,activeChat=null;

function blank(){return{v:3,initialized:false,player:{name:'',handle:'',city:'',bio:'',avatar:'',followers:18,following:0,views:0,reach:0},bots:[],posts:[],stories:[],messages:{},likes:{},followingIds:[],activity:[],created:Date.now()}}
function avatar(n,i){return `https://picsum.photos/seed/aigram_${encodeURIComponent(n)}_${i}/180/180`}
function image(seed){return `https://picsum.photos/seed/${encodeURIComponent(seed)}/900/900`}
function seed(){if(!state.bots.length)for(let i=0;i<90;i++){let f=FIRST[i%FIRST.length];state.bots.push({id:'b'+i,name:f+' '+String.fromCharCode(65+i%26)+'.',handle:f.toLowerCase()+String(i+7),city:CITIES[i%CITIES.length],bio:BIOS[i%BIOS.length],avatar:avatar(f,i),followers:80+Math.floor(Math.random()*25000),trait:['warm','flirty','funny','direct','soft','curious'][i%6],affinity:Math.floor(Math.random()*16),topics:[CITIES[i%CITIES.length].toLowerCase(),['travel','fitness','food','cars','music','fashion'][i%6]]})}}
function seedPosts(){let n=state.posts.filter(p=>p.author!=='player').length;for(let i=n;i<170;i++){let b=state.bots[Math.floor(Math.random()*state.bots.length)];state.posts.push({id:'p'+Date.now()+i+Math.random(),author:b.id,img:image(b.handle+'_'+i),cap:CAPS[Math.floor(Math.random()*CAPS.length)]+' #'+b.topics[1],likes:8+Math.floor(Math.random()*1600),comments:[],created:Date.now()-Math.random()*5*864e5})}}
async function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function save(){try{let d=await db();await new Promise((ok,no)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(state,KEY);t.oncomplete=ok;t.onerror=()=>no(t.error)})}catch(e){console.error(e)}}
async function load(){try{let d=await db();state=await new Promise((ok,no)=>{let t=d.transaction(STORE);let r=t.objectStore(STORE).get(KEY);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})||blank()}catch(e){state=blank()}seed();seedPosts();await save()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bot(id){return state.bots.find(x=>x.id===id)}function auth(p){return p.author==='player'?{id:'player',handle:state.player.handle,name:state.player.name,city:state.player.city,avatar:state.player.avatar||image('meavatar')}:bot(p.author)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1800)}
async function fileData(f,max=1080){return new Promise((ok,no)=>{let r=new FileReader(),im=new Image();r.onload=e=>{im.onload=()=>{let s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78))};im.src=e.target.result};r.onerror=no;r.readAsDataURL(f)})}

function words(txt){return String(txt||'').toLowerCase().replace(/[^\p{L}\p{N}#@ ]/gu,' ').split(/\s+/).filter(x=>x.length>2)}
function contextComment(cap,b){
 let w=words(cap), lower=cap.toLowerCase(), place=CITIES.find(c=>lower.includes(c.toLowerCase())), tag=(cap.match(/#[\p{L}\p{N}_]+/u)||[])[0];
 let opts=[];
 if(place) opts.push(`${place}? Ale klimat 🔥`,`Byłem/am w ${place} i serio chcę tam wrócić.`,`To ${place}? Świetnie wygląda 👀`,`Jak Ci się podoba ${place}?`);
 if(/gór|mount|szlak|hike/i.test(lower))opts.push('Ten widok z gór jest konkretny 🔥','Jaki to szlak?','Po takim zdjęciu sam/a mam ochotę ruszyć w góry.');
 if(/morze|ocean|plaż|beach|makarsk|split/i.test(lower))opts.push('Ten nadmorski vibe robi robotę.','Okej, zazdroszczę tego widoku 😄','Jak tam woda? 👀');
 if(/auto|samoch|car|bmw|alfa|audi/i.test(lower))opts.push('Auto + ten kadr = 🔥','Dobra, to zdjęcie siadło. Co to za model?','Ten setup wygląda naprawdę dobrze.');
 if(/trening|gym|siłown|biega|fitness/i.test(lower))opts.push('Forma idzie w dobrą stronę 💪','Jaki dziś trening?','Szacun za regularność.');
 if(/ostatni|jutro|next|wyjazd|jedziemy/i.test(lower))opts.push('To czekam na jutrzejszy update 👀','Czyli następny przystanek już jutro?','Dawaj potem relację z kolejnego miejsca.');
 if(tag)opts.push(`${tag} zdecydowanie pasuje do tego posta.`);
 if(w.length)opts.push(`Ten opis + zdjęcie mają naprawdę dobry vibe.`,`No dobra, tutaj opis pasuje idealnie 👀`,`To wygląda jak jeden z lepszych postów na Twoim profilu.`);
 if(b.trait==='flirty')opts.push('Nie wiem czy bardziej patrzę na kadr czy na Ciebie 😏','Okej, tym postem zwróciłeś/aś moją uwagę 👀');
 if(b.trait==='direct')opts.push('To jest po prostu dobry post.','Bez zbędnego gadania: 🔥');
 return opts[Math.floor(Math.random()*opts.length)]||'Świetny post 🔥'
}
function dmReply(b,text){
 let lower=text.toLowerCase(), hist=state.messages[b.id]||[], lastUser=hist.filter(m=>m.from==='me').slice(-3).map(m=>m.text).join(' ');
 let opts=[];
 if(/\bhej|cześć|siema|hello\b/i.test(lower))opts.push(`Hej ${state.player.name||''} 😄 Co robisz?`,'No hej 👀 Jak Ci mija dzień?');
 if(/\bgdzie|where\b/i.test(lower))opts.push(`Teraz jestem w ${b.city}. A Ty?`,`W ${b.city}. Chociaż chętnie bym gdzieś wyskoczył/a.`);
 if(/\bjak tam|co tam|jak się/i.test(lower))opts.push('Całkiem dobrze. Trochę chaosu dzisiaj 😄 A u Ciebie?','Dobrze, właśnie nadrabiam co się działo. A Ty?');
 if(/\bspotk|kawa|coffee|drink/i.test(lower))opts.push('Brzmi kusząco 👀 Kiedy?','Kawa brzmi dobrze. Gdzie byś poszedł/poszła?');
 if(/\bzdję|post|relac/i.test(lower)){let mine=state.posts.filter(p=>p.author==='player').sort((a,c)=>c.created-a.created)[0];opts.push(mine?`Widziałem/am Twój ostatni post. "${mine.cap.slice(0,55)}" — dobry był 😄`:'Musisz coś wrzucić, wtedy ocenię 😄')}
 if(/\bmakarsk|split|chorwac/i.test(lower))opts.push('Chorwacja? No to teraz rozumiem te zdjęcia 😄','Makarska i Split są świetne. Co najbardziej Ci siadło?');
 if(text.includes('?'))opts.push('Dobre pytanie 😄 Chyba zależy od sytuacji. A Ty jak to widzisz?','Hmm, muszę się zastanowić. Ty pierwszy/a odpowiedz 😄');
 if(b.trait==='flirty')opts.push('Ty zawsze tak piszesz czy tylko do mnie? 😏','Nie powiem, ta rozmowa robi się ciekawa 👀');
 if(b.trait==='funny')opts.push('Hahaha, dobra 😂','No pięknie, już wiem z kim mam do czynienia 😂');
 if(lastUser.length>40)opts.push('W sumie po tym co wcześniej pisałeś/aś, zaczynam rozumieć Twój punkt widzenia.','Pamiętam, że już zahaczyliśmy o ten temat 👀');
 return opts[Math.floor(Math.random()*opts.length)]||['Opowiadaj dalej.','Serio? 👀','Okej, to mnie zaciekawiło.','A Ty co o tym myślisz?'][Math.floor(Math.random()*4)]
}

async function finishOnboarding(){let n=obName.value.trim(),h=obHandle.value.trim().replace(/^@/,'').replace(/\s/g,'');if(!n||!h)return toast('Wpisz nazwę i login');let f=obAvatar.files[0];state.player={...state.player,name:n,handle:h,city:obCity.value.trim(),bio:obBio.value.trim(),avatar:f?await fileData(f,420):''};state.initialized=true;await save();onboard.classList.remove('show');renderAll()}
function refreshFeed(add=false){if(add)for(let i=0;i<4;i++){let b=state.bots[Math.floor(Math.random()*state.bots.length)];state.posts.push({id:'n'+Date.now()+i,author:b.id,img:image(b.handle+Date.now()+i),cap:CAPS[Math.floor(Math.random()*CAPS.length)]+' #'+b.topics[1],likes:5+Math.floor(Math.random()*500),comments:[],created:Date.now()})}let own=state.posts.filter(p=>p.author==='player').sort((a,b)=>b.created-a.created),ai=shuffle(state.posts.filter(p=>p.author!=='player'));feedOrder=ai.map(p=>p.id);if(own[0])feedOrder.splice(2,0,own[0].id);feedLimit=20;save();renderFeed();if(add)toast('Nowe posty w feedzie')}
function card(p){let a=auth(p),cs=p.comments||[];return `<article class="card"><div class="head" onclick="${p.author==='player'?"switchPage('profile')":"openBot('"+a.id+"')"}"><img class="avatar" src="${a.avatar}"><div class="who"><b>${esc(a.handle)}</b><small>${esc(a.city||'')}</small></div><span class="sp"></span><span class="badge">${p.author==='player'?'TY':'AI'}</span></div><img class="postimg" src="${p.img}" loading="lazy"><div class="actions"><button onclick="like('${p.id}')">${state.likes[p.id]?'♥':'♡'}</button><button onclick="document.getElementById('ci_${p.id}').focus()">♡̷</button>${p.author!=='player'?`<button onclick="openChat('${a.id}')">✉</button>`:''}</div><div class="body"><b>${p.likes+(state.likes[p.id]?1:0)} polubień</b><div class="caption"><b>${esc(a.handle)}</b> ${esc(p.cap)}</div><div>${cs.slice(-18).map(c=>`<div class="comment" id="comment_${c.id}"><b>${esc(c.user)}</b> ${esc(c.text)} ${p.author==='player'&&c.botId?`<button class="secondary tiny" onclick="replyTo('${p.id}','${c.id}')">Odpowiedz</button>`:''}${(c.replies||[]).map(r=>`<div class="reply"><b>${esc(r.user)}</b> ${esc(r.text)}</div>`).join('')}</div>`).join('')}</div><div class="commentbox"><input id="ci_${p.id}" placeholder="Dodaj komentarz..."><button class="secondary" onclick="addComment('${p.id}')">Wyślij</button></div></div></article>`}
function renderFeed(){let m=new Map(state.posts.map(p=>[p.id,p])),arr=feedOrder.map(id=>m.get(id)).filter(Boolean).slice(0,feedLimit);feed.innerHTML=arr.map(card).join('')+(feedLimit<feedOrder.length?`<button class="secondary" style="width:100%;margin-bottom:90px" onclick="feedLimit+=20;renderFeed()">Pokaż więcej</button>`:'')}
function renderStories(){stories.innerHTML=`<div class="story" onclick="switchPage('create')"><img src="${state.player.avatar||image('me')}"><span>Twoja relacja</span></div>`+shuffle(state.bots).slice(0,22).map(b=>`<div class="story" onclick="openStory('${b.id}')"><img src="${b.avatar}"><span>${esc(b.handle)}</span></div>`).join('')}
function renderSuggestions(){let s=shuffle(state.bots.filter(b=>!state.followingIds.includes(b.id))).slice(0,7);suggestions.innerHTML=`<div class="suggest">${s.map(b=>`<div class="panel"><img src="${b.avatar}"><b style="display:block">@${esc(b.handle)}</b><span class="muted">${esc(b.city)}</span><br><button class="primary tiny" onclick="toggleFollow('${b.id}')">Obserwuj</button></div>`).join('')}</div>`}
function renderExplore(){let q=(exploreSearch.value||'').toLowerCase(),posts=state.posts.filter(p=>{let a=auth(p);return !q||p.cap.toLowerCase().includes(q)||a.handle.toLowerCase().includes(q)||(a.city||'').toLowerCase().includes(q)});exploreGrid.innerHTML=shuffle(posts).slice(0,90).map(p=>`<img src="${p.img}" onclick="${p.author==='player'?"openMy('"+p.id+"')":"openBot('"+p.author+"')"}">`).join('')}
function renderMessages(){let q=(peopleSearch.value||'').toLowerCase(),ids=Object.keys(state.messages);messageList.innerHTML=ids.filter(id=>{let b=bot(id);return b&&(!q||b.handle.includes(q)||b.name.toLowerCase().includes(q))}).map(id=>{let b=bot(id),ms=state.messages[id],last=ms[ms.length-1];return `<div class="person" onclick="openChat('${id}')"><img class="avatar" src="${b.avatar}"><div><b>@${esc(b.handle)}</b><div class="muted">${esc(last?.text||'')}</div></div></div>`}).join('')||'<p class="muted">Jeszcze z nikim nie pisałeś/aś.</p>';peopleList.innerHTML=state.bots.filter(b=>!q||b.handle.includes(q)||b.name.toLowerCase().includes(q)||b.city.toLowerCase().includes(q)).slice(0,35).map(b=>`<div class="person"><img class="avatar" src="${b.avatar}" onclick="openBot('${b.id}')"><div><b>${esc(b.name)}</b><div class="muted">@${esc(b.handle)} · ${esc(b.city)}</div></div><button class="secondary followbtn" onclick="openChat('${b.id}')">Napisz</button></div>`).join('')}
function renderProfile(){let mine=state.posts.filter(p=>p.author==='player').sort((a,b)=>b.created-a.created);profileHead.innerHTML=`<div class="profileline"><img src="${state.player.avatar||image('me')}"><div><h2 style="margin:0">@${esc(state.player.handle)}</h2><b>${esc(state.player.name)}</b><div class="muted">${esc(state.player.bio)}</div></div></div><div class="stats"><div><b>${mine.length}</b><div class="muted">posty</div></div><div><b>${state.player.followers}</b><div class="muted">followers</div></div><div><b>${state.player.following}</b><div class="muted">obserwujesz</div></div></div>`;insights.innerHTML=`<h3>Insights</h3><div class="insights"><div class="metric"><b>${state.player.reach}</b>Zasięg</div><div class="metric"><b>${state.player.views}</b>Profil</div><div class="metric"><b>${Object.values(state.likes).filter(Boolean).length}</b>Twoje lajki</div><div class="metric"><b>${Object.keys(state.messages).length}</b>Rozmowy</div></div>`;myGrid.innerHTML=mine.map(p=>`<img src="${p.img}" onclick="openMy('${p.id}')">`).join('')}
function renderActivity(){activityList.innerHTML=state.activity.slice(0,80).map(a=>`<div class="panel">${esc(a.text)}<div class="muted">${new Date(a.time).toLocaleString()}</div></div>`).join('')||'<p class="muted">Brak aktywności.</p>'}
function renderAll(){renderStories();renderSuggestions();refreshFeed(false);renderExplore();renderMessages();renderProfile();renderActivity()}

async function publishPost(){let f=postImage.files[0];if(!f)return toast('Wybierz zdjęcie');let cap=postCaption.value.trim(),p={id:'u'+Date.now(),author:'player',img:await fileData(f),cap,likes:40+Math.floor(Math.random()*260),comments:[],created:Date.now()};let count=18+Math.floor(Math.random()*25),people=shuffle(state.bots).slice(0,count);people.forEach((b,i)=>p.comments.push({id:'c'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2),botId:b.id,user:b.handle,text:contextComment(cap,b),replies:[]}));let gain=20+Math.floor(Math.random()*90)+Math.floor(count*1.4);state.player.followers+=gain;state.player.reach+=500+Math.floor(Math.random()*4500);state.player.views+=50+Math.floor(Math.random()*650);state.posts.push(p);state.activity.unshift({time:Date.now(),text:`Twój nowy post zdobył pierwsze ${p.likes} polubień, ${count} komentarzy i +${gain} followersów.`});await save();postImage.value='';postCaption.value='';refreshFeed(false);renderProfile();switchPage('profile');toast('Post opublikowany')}
async function publishStory(){let f=storyImage.files[0];if(!f)return toast('Wybierz zdjęcie');let s={id:'s'+Date.now(),img:await fileData(f),cap:storyCaption.value.trim(),created:Date.now(),views:80+Math.floor(Math.random()*900),replies:[]},n=6+Math.floor(Math.random()*12);shuffle(state.bots).slice(0,n).forEach(b=>{let txt=contextComment(s.cap||'relacja',b);s.replies.push({botId:b.id,text:txt});state.messages[b.id]=state.messages[b.id]||[];state.messages[b.id].push({from:'bot',text:'Odpowiedź na Twoją relację: '+txt,time:Date.now()})});state.stories.push(s);state.activity.unshift({time:Date.now(),text:`Relacja: ${s.views} wyświetleń i ${n} odpowiedzi w DM.`});await save();renderMessages();renderActivity();toast('Relacja dodana')}
function like(id){state.likes[id]=!state.likes[id];save();renderFeed()}
function addComment(id){let i=document.getElementById('ci_'+id),t=i.value.trim();if(!t)return;let p=state.posts.find(x=>x.id===id);p.comments.push({id:'self'+Date.now(),user:state.player.handle,text:t,replies:[]});i.value='';save();renderFeed()}
function replyTo(pid,cid){let p=state.posts.find(x=>x.id===pid),c=p.comments.find(x=>x.id===cid);if(!c)return;modalBox.innerHTML=`<h3>Odpowiedź dla @${esc(c.user)}</h3><div class="panel">${esc(c.text)}</div><textarea id="replyInput" rows="3" placeholder="Napisz odpowiedź..."></textarea><div class="row"><button class="secondary" onclick="closeModal()">Anuluj</button><span class="sp"></span><button class="primary" onclick="saveReply('${pid}','${cid}')">Wyślij</button></div>`;modal.classList.add('show')}
async function saveReply(pid,cid){let t=replyInput.value.trim();if(!t)return;let p=state.posts.find(x=>x.id===pid),c=p.comments.find(x=>x.id===cid);c.replies.push({user:state.player.handle,text:t});let b=bot(c.botId);await save();closeModal();setTimeout(async()=>{if(Math.random()<.72){c.replies.push({user:b.handle,text:dmReply(b,t)});await save();renderFeed();renderProfile()}},650);renderFeed();renderProfile()}
function openMy(id){let p=state.posts.find(x=>x.id===id);modalBox.innerHTML=`<div class="row"><b>Twój post</b><span class="sp"></span><button class="secondary" onclick="closeModal()">×</button></div>${card(p)}`;modal.classList.add('show')}
function openBot(id){let b=bot(id),f=state.followingIds.includes(id);modalBox.innerHTML=`<div class="profileline"><img src="${b.avatar}"><div><h2 style="margin:0">${esc(b.name)}</h2><div>@${esc(b.handle)} · ${esc(b.city)}</div><div class="muted">${esc(b.bio)}</div><b>${b.followers} followers</b></div></div><div class="row" style="margin-top:12px"><button class="primary" onclick="openChat('${id}')">Napisz</button><button class="secondary" onclick="toggleFollow('${id}')">${f?'Obserwujesz':'Obserwuj'}</button><span class="sp"></span><button class="secondary" onclick="closeModal()">×</button></div>`;modal.classList.add('show')}
async function toggleFollow(id){let i=state.followingIds.indexOf(id);if(i>=0){state.followingIds.splice(i,1);state.player.following--}else{state.followingIds.push(id);state.player.following++;let b=bot(id);state.activity.unshift({time:Date.now(),text:`Zacząłeś/aś obserwować @${b.handle}.`})}await save();renderSuggestions();renderProfile();openBot(id)}
function openChat(id){activeChat=id;let b=bot(id);state.messages[id]=state.messages[id]||[];let ms=state.messages[id];modalBox.innerHTML=`<div class="row"><img class="avatar" src="${b.avatar}"><div><b>${esc(b.name)}</b><div class="muted">@${esc(b.handle)}</div></div><span class="sp"></span><button class="secondary" onclick="closeModal()">×</button></div><div id="chatlog" class="chatlog">${ms.map(m=>`<div class="bubble ${m.from==='me'?'me':'bot'}">${esc(m.text)}</div>`).join('')||'<p class="muted">Rozpocznij rozmowę.</p>'}</div><div class="commentbox"><input id="chatInput" placeholder="Wiadomość..." onkeydown="if(event.key==='Enter')sendChat()"><button class="primary" onclick="sendChat()">Wyślij</button></div>`;modal.classList.add('show');setTimeout(()=>chatlog.scrollTop=chatlog.scrollHeight,30)}
async function sendChat(){let t=chatInput.value.trim();if(!t)return;let id=activeChat,b=bot(id);state.messages[id].push({from:'me',text:t,time:Date.now()});b.affinity=Math.min(100,b.affinity+1);await save();openChat(id);setTimeout(async()=>{state.messages[id].push({from:'bot',text:dmReply(b,t),time:Date.now()});await save();if(activeChat===id)openChat(id);renderMessages()},650)}
function openStory(id){let b=bot(id);modalBox.innerHTML=`<div class="row"><img class="avatar" src="${b.avatar}"><b>@${b.handle}</b><span class="sp"></span><button class="secondary" onclick="closeModal()">×</button></div><img class="storyview" src="${image('story_'+id+'_'+Math.floor(Date.now()/18e5))}"><div class="commentbox"><input id="sr" placeholder="Odpowiedz na relację..."><button class="primary" onclick="storyReply('${id}')">Wyślij</button></div>`;modal.classList.add('show')}
async function storyReply(id){let t=sr.value.trim();if(!t)return;state.messages[id]=state.messages[id]||[];state.messages[id].push({from:'me',text:'Odpowiedź na relację: '+t,time:Date.now()});await save();closeModal();setTimeout(async()=>{let b=bot(id);state.messages[id].push({from:'bot',text:dmReply(b,t),time:Date.now()});await save();renderMessages()},500);toast('Wysłano do DM')}
function closeModal(){modal.classList.remove('show');activeChat=null}
function switchPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));if(id==='explore')renderExplore();if(id==='messages')renderMessages();if(id==='profile')renderProfile()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));modal.onclick=e=>{if(e.target===modal)closeModal()};
(async()=>{await load();if(!state.initialized)onboard.classList.add('show');renderAll()})();setInterval(()=>state?.initialized&&save(),12000);document.addEventListener('visibilitychange',()=>document.hidden&&save());
</script></body></html>
