<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.json">
<title>AIgram V6</title>
<style>
:root{
 --bg:#09090b;--surface:#111216;--surface2:#181a20;--surface3:#20232b;
 --text:#f7f7f8;--muted:#9198a5;--line:#262933;--accent:#8b5cf6;--accent2:#ec4899;--blue:#4f8cff;
 --shadow:0 12px 40px rgba(0,0,0,.25)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
body{overscroll-behavior-y:contain}
button,input,textarea{font:inherit}
button{cursor:pointer}
img{background:#17191f}
.app{max-width:640px;margin:auto;min-height:100vh;padding-bottom:84px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(9,9,11,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.05);padding:10px 12px 8px;display:flex;align-items:center;gap:8px}
.logo{font-size:25px;font-weight:850;letter-spacing:-1px}.logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border:0;background:transparent;color:var(--text);border-radius:50%;display:grid;place-items:center}
.iconbtn:active{background:var(--surface2)}
.icon{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page{display:none;padding:10px 10px 0}.page.active{display:block}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(12,12,15,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav .inner{max-width:640px;margin:auto;display:flex}
.navbtn{flex:1;border:0;background:none;color:var(--muted);padding:9px 3px 7px;display:grid;place-items:center;gap:2px}
.navbtn.active{color:var(--text)}
.navbtn small{font-size:9px}
.card,.panel{background:var(--surface);border:1px solid rgba(255,255,255,.055);border-radius:18px;box-shadow:0 3px 16px rgba(0,0,0,.12)}
.card{overflow:hidden;margin-bottom:14px}.panel{padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column}.muted{color:var(--muted)}.tiny{font-size:11px}
.avatar{width:43px;height:43px;border-radius:50%;object-fit:cover}.avatar.lg{width:86px;height:86px}
.posthead{padding:10px 11px}.postimg{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
.postactions{display:flex;align-items:center;padding:5px 7px}.postactions button{width:40px;height:40px}
.postbody{padding:0 12px 13px;line-height:1.45}.caption{margin:6px 0 8px}
.comment{margin:8px 0}.reply{margin:6px 0 0 18px;border-left:2px solid var(--line);padding-left:9px}
.pill{border:0;border-radius:999px;padding:8px 12px;background:var(--surface3);color:var(--text)}
.primary{border:0;border-radius:12px;padding:10px 14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:750}
.secondary{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface2);color:var(--text)}
.linkbtn{border:0;background:none;color:#b9a6ff;padding:3px 5px}
.searchwrap{position:relative;margin-bottom:10px}.searchwrap svg{position:absolute;left:12px;top:11px;color:var(--muted);width:20px}
.search,input[type=text],textarea{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:13px;padding:11px 12px}
.search{padding-left:40px}
.stories{display:flex;overflow:auto;gap:12px;padding:6px 1px 14px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.story{width:72px;flex:0 0 72px;text-align:center}.storyring{padding:2px;border-radius:50%;background:linear-gradient(145deg,#f59e0b,#ec4899,#8b5cf6)}
.story img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--bg);display:block}.story span{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.suggest{display:flex;overflow:auto;gap:9px;margin-bottom:13px;scrollbar-width:none}.suggest .suggestcard{min-width:158px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:13px}
.suggestcard img{width:62px;height:62px;border-radius:50%;object-fit:cover}
.explore{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.explore img{width:100%;aspect-ratio:1;object-fit:cover}
.profiletop{display:flex;gap:16px;align-items:center}.profilemeta{min-width:0;flex:1}.profilemeta h2{margin:0 0 3px;font-size:21px}.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:16px 0}.stats b{font-size:18px}
.profilebuttons{display:flex;gap:8px}.profilebuttons button{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid img{width:100%;aspect-ratio:1;object-fit:cover}
.people{display:grid;gap:8px}.person{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:15px}
.person .grow{min-width:0;flex:1}.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatlog{height:58vh;overflow:auto;padding:11px;background:#0c0d10;border:1px solid var(--line);border-radius:15px;margin:10px 0}
.bubble{max-width:82%;padding:9px 11px;margin:7px 0;border-radius:17px;line-height:1.4}.bubble.me{margin-left:auto;background:linear-gradient(135deg,#5b64f3,#8b5cf6)}.bubble.bot{background:var(--surface2)}
.composer{display:flex;gap:7px;align-items:center}.composer input{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:11px 14px}
.modal,.onboard{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:none;padding:12px;overflow:auto}.modal.show,.onboard.show{display:block}
.modalbox,.onbox{max-width:610px;margin:3vh auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.onboard{background:var(--bg);z-index:200}.onbox{margin:8vh auto}
.onbox input,.onbox textarea{margin:6px 0}
.toast{display:none;position:fixed;z-index:300;bottom:92px;left:50%;transform:translateX(-50%);background:#f6f7fb;color:#111;padding:10px 14px;border-radius:11px;box-shadow:var(--shadow)}
.creatorHero{border:1px dashed #444856;border-radius:18px;min-height:240px;display:grid;place-items:center;text-align:center;background:linear-gradient(180deg,#121319,#0e0f13);overflow:hidden}
.creatorHero img{width:100%;max-height:430px;object-fit:contain}
.creatorTabs{display:flex;gap:8px;margin-bottom:12px}.creatorTabs button{flex:1}
.formlabel{display:block;font-weight:700;margin:12px 0 6px}
.hidden{display:none!important}.sectiontitle{font-size:16px;margin:8px 0 10px}.metricgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:var(--surface2);border-radius:14px;padding:12px}.metric b{font-size:21px;display:block}
.storyview{width:100%;max-height:72vh;object-fit:contain;border-radius:14px}
.settingsrow{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:10px}.settingsrow:last-child{border-bottom:0}
.switch{margin-left:auto;width:45px;height:26px;border-radius:99px;background:#383b46;position:relative}.switch.on{background:var(--accent)}.switch:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.switch.on:after{left:22px}
.bio{white-space:pre-wrap}

.reelcard{position:relative;background:#050506;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px;min-height:72vh;display:flex;align-items:flex-end}
.reelcard>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.82}
.reelshade{position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.88))}
.reelinfo{position:relative;z-index:2;padding:18px 70px 20px 14px;width:100%}
.reelactions{position:absolute;z-index:3;right:8px;bottom:25px;display:grid;gap:8px;text-align:center}
.reelactions button{background:rgba(0,0,0,.35);backdrop-filter:blur(8px)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.11);font-size:11px}
.typing{display:inline-flex;gap:4px;padding:10px 13px;background:var(--surface2);border-radius:17px;margin:7px 0}.typing i{width:5px;height:5px;background:#aaa;border-radius:50%;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.notice-dot{width:8px;height:8px;border-radius:50%;background:#ff3b6b;position:absolute;top:7px;right:7px}

</style>
</head>
<body>
<div class="app">
<header class="topbar">
<div class="logo"><span>AIgram</span></div><div class="spacer"></div>
<button class="iconbtn" aria-label="Aktywność" onclick="switchPage('activity')"><svg class="icon"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg></button>
<button class="iconbtn" aria-label="Wiadomości" onclick="switchPage('messages')"><svg class="icon"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
</header>
<main>
<section id="home" class="page active"><div id="stories" class="stories"></div><div id="suggestions"></div><div id="feed"></div></section>

<section id="explore" class="page">
<div class="searchwrap"><svg class="icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="exploreSearch" class="search" placeholder="Szukaj osób, miejsc, hashtagów..." oninput="renderExplore()"></div>
<div id="exploreGrid" class="explore"></div>
</section>

<section id="create" class="page">
<div class="creatorTabs"><button id="tabPost" class="primary" onclick="creatorTab('post')">Post</button><button id="tabStory" class="secondary" onclick="creatorTab('story')">Relacja</button></div>
<div id="createPost" class="panel">
<div id="postPreview" class="creatorHero" onclick="postImage.click()"><div><svg class="icon" style="width:42px;height:42px"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><h3>Wybierz zdjęcie</h3><span class="muted">Dotknij, aby wybrać z telefonu</span></div></div>
<input id="postImage" class="hidden" type="file" accept="image/*" onchange="previewSelected(this,'postPreview')">
<label class="formlabel">Opis</label><textarea id="postCaption" rows="4" placeholder="Napisz coś o tym zdjęciu..."></textarea>
<label class="formlabel">Lokalizacja</label><input id="postLocation" type="text" placeholder="np. Makarska, Chorwacja">
<label class="formlabel">Hashtagi</label><input id="postTags" type="text" placeholder="#travel #summer">
<div class="settingsrow"><span>Dodaj też do relacji</span><div id="shareStoryToggle" class="switch" onclick="this.classList.toggle('on')"></div></div>
<button class="primary" style="width:100%;margin-top:12px" onclick="publishPost()">Opublikuj post</button>
</div>

<div id="createStory" class="panel hidden">
<div id="storyPreview" class="creatorHero" onclick="storyImage.click()"><div><svg class="icon" style="width:42px;height:42px"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><h3>Dodaj relację</h3><span class="muted">Zdjęcie z telefonu</span></div></div>
<input id="storyImage" class="hidden" type="file" accept="image/*" onchange="previewSelected(this,'storyPreview')">
<label class="formlabel">Tekst</label><textarea id="storyCaption" rows="3" placeholder="Dodaj tekst do relacji..."></textarea>
<button class="primary" style="width:100%;margin-top:12px" onclick="publishStory()">Udostępnij relację</button>
</div>
</section>


<section id="reels" class="page">
  <div class="row" style="padding:2px 2px 10px"><h3 style="margin:0">Reels</h3><span class="spacer"></span><span class="muted tiny">AI feed</span></div>
  <div id="reelsFeed"></div>
</section>
<section id="messages" class="page">
<div class="searchwrap"><svg class="icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="peopleSearch" class="search" placeholder="Szukaj rozmów..." oninput="renderMessages()"></div>
<div id="messageList"></div><h3 class="sectiontitle">Proponowane osoby</h3><div id="peopleList" class="people"></div>
</section>

<section id="activity" class="page"><h3 class="sectiontitle">Aktywność</h3><div id="activityList"></div></section>

<section id="profile" class="page">
<div id="profileHead" class="panel"></div>
<div id="insights" class="panel"></div>
<div class="row" style="padding:3px 3px 9px"><b>Posty</b><div class="spacer"></div><button class="iconbtn" onclick="openSettings()"><svg class="icon"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21h-4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-2.8-2.8.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H3v-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1L7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V3h4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1H21v4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button></div>
<div id="myGrid" class="grid"></div>
</section>
</main>
</div>

<nav class="bottomnav"><div class="inner">
<button class="navbtn active" data-page="home"><svg class="icon"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg><small>Home</small></button>
<button class="navbtn" data-page="explore"><svg class="icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><small>Szukaj</small></button>
<button class="navbtn" data-page="reels"><svg class="icon"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 4 4 6M13 4l4 6M8 14l4 2.5L8 19Z"/></svg><small>Reels</small></button>
<button class="navbtn" data-page="create"><svg class="icon"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg><small>Dodaj</small></button>
<button class="navbtn" data-page="messages"><svg class="icon"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg><small>DM</small></button>
<button class="navbtn" data-page="profile"><svg class="icon"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><small>Profil</small></button>
</div></nav>

<div id="modal" class="modal"><div id="modalBox" class="modalbox"></div></div>
<div id="onboard" class="onboard"><div class="onbox"><h2>Twój profil</h2><p class="muted">To Ty prowadzisz jedyne prawdziwe konto w AIgram.</p><input id="obName" type="text" placeholder="Nazwa profilu"><input id="obHandle" type="text" placeholder="Login"><input id="obCity" type="text" placeholder="Miasto"><textarea id="obBio" rows="3" placeholder="Bio"></textarea><input id="obAvatar" type="file" accept="image/*"><button class="primary" style="width:100%;margin-top:10px" onclick="finishOnboarding()">Utwórz profil</button></div></div>
<div id="toast" class="toast"></div>

<script>
const DB='AIgramV6DB',STORE='state',KEY='main';
const FIRST=['Lena','Mila','Noah','Aya','Zoe','Nina','Leo','Sofia','Maya','Emil','Clara','Luca','Emma','Max','Nora','Theo','Julia','Oskar','Amelia','Finn','Elsa','Miko','Laura','Alex','Sara','Kai','Mia','Ben','Lina','Eli','Olivia','Daniel','Hanna','Victor','Elena','Adam','Iga','Klara','Anton','Marta'];
const CITIES=['Berlin','Warszawa','Amsterdam','London','Tokyo','Barcelona','Rome','Prague','Vienna','Paris','Lisbon','Oslo','Makarska','Wrocław','Split','Zagreb'];
const BIOS=['travel • coffee • photos','city life & late nights','fitness • food • trips','photography and small adventures','music • friends • spontaneous plans','ocean, mountains, good people'];
const CAPS=['Poranek bez pośpiechu.','Jeszcze jedno z dzisiaj.','Ten widok zostaje w głowie.','Weekend dobrze się zaczyna.','Bez większego planu.','Trochę miasta, trochę chaosu.','Dzisiaj tylko dobry vibe.','W drodze gdzieś dalej.','Wieczór był lepszy niż plan.','Potrzebowałem/am takiego dnia.'];
let state,feedOrder=[],feedLimit=20,activeChat=null;

function blank(){return{v:4,initialized:false,player:{name:'',handle:'',city:'',bio:'',avatar:'',followers:18,following:0,views:0,reach:0,private:false},bots:[],posts:[],stories:[],messages:{},likes:{},saved:[],followingIds:[],activity:[],highlights:[],reelLikes:{},mutedIds:[],blockedIds:[],lastSocialTick:Date.now(),created:Date.now()}}
function imgSeed(s,w=900){return `https://picsum.photos/seed/${encodeURIComponent(s)}/${w}/${w}`}
function seedBots(){if(state.bots.length)return;for(let i=0;i<100;i++){let f=FIRST[i%FIRST.length];state.bots.push({id:'b'+i,name:f+' '+String.fromCharCode(65+i%26)+'.',handle:f.toLowerCase()+(i+7),city:CITIES[i%CITIES.length],bio:BIOS[i%BIOS.length],avatar:imgSeed('ava_'+f+i,180),followers:80+Math.floor(Math.random()*35000),trait:['warm','flirty','funny','direct','soft','curious'][i%6],affinity:Math.floor(Math.random()*18),chemistry:Math.floor(Math.random()*35),mood:['chill','bold','teasing','jealous','sweet'][i%5],memory:[],topics:[CITIES[i%CITIES.length].toLowerCase(),['travel','fitness','food','cars','music','fashion'][i%6]]})}}
function seedPosts(){let existing=state.posts.filter(p=>p.author!=='player').length;for(let i=existing;i<190;i++){let b=state.bots[Math.floor(Math.random()*state.bots.length)];state.posts.push({id:'p'+i+'_'+Date.now(),author:b.id,img:imgSeed(b.handle+'_'+i),cap:CAPS[Math.floor(Math.random()*CAPS.length)]+' #'+b.topics[1],location:b.city,likes:8+Math.floor(Math.random()*1800),comments:[],created:Date.now()-Math.random()*6*864e5})}}
async function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function save(){try{let d=await openDB();await new Promise((ok,no)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(state,KEY);t.oncomplete=ok;t.onerror=()=>no(t.error)})}catch(e){console.error(e)}}
async function load(){try{let d=await openDB();state=await new Promise((ok,no)=>{let t=d.transaction(STORE);let r=t.objectStore(STORE).get(KEY);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})||blank()}catch(e){state=blank()}seedBots();seedPosts();await save()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bot(id){return state.bots.find(b=>b.id===id)}
function author(p){return p.author==='player'?{id:'player',name:state.player.name,handle:state.player.handle,city:state.player.city,avatar:state.player.avatar||imgSeed('me',180)}:bot(p.author)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display='none',1700)}
async function fileData(f,max=1200){return new Promise((ok,no)=>{let r=new FileReader(),im=new Image();r.onload=e=>{im.onload=()=>{let s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};im.src=e.target.result};r.onerror=no;r.readAsDataURL(f)})}
function previewSelected(input,target){let f=input.files[0];if(!f)return;let u=URL.createObjectURL(f);document.getElementById(target).innerHTML=`<img src="${u}">`}
function creatorTab(which){createPost.classList.toggle('hidden',which!=='post');createStory.classList.toggle('hidden',which!=='story');tabPost.className=which==='post'?'primary':'secondary';tabStory.className=which==='story'?'primary':'secondary'}
function contextSignals(cap){let t=(cap||'').toLowerCase();return{t,place:CITIES.find(c=>t.includes(c.toLowerCase())),hotel:/hotel|szlafrok|room|pokój/.test(t),travel:/wyjazd|podróż|trip|wakac|jutro|ostatni|jedziemy|ruszamy/.test(t),sea:/morze|plaż|beach|makarsk|split|chorwac/.test(t),gym:/trening|gym|siłown|fitness/.test(t),car:/auto|samoch|car|bmw|audi|alfa/.test(t),provocative:/kochani|podobam|hot|sexy|😏|🔥|dziwk|babe/.test(t),hashtag:(t.match(/#[\p{L}\p{N}_]+/gu)||[])[0]||''}}
function commentPool(cap,b){let s=contextSignals(cap),o=[];

function renderSuggestions(){let s=shuffle(state.bots.filter(b=>!state.followingIds.includes(b.id))).slice(0,8);suggestions.innerHTML=`<div class="row" style="margin:1px 2px 8px"><b>Proponowane dla Ciebie</b><span class="spacer"></span><span class="muted tiny">Odkrywaj</span></div><div class="suggest">${s.map(b=>`<div class="suggestcard"><img src="${b.avatar}"><b style="display:block;margin-top:6px">@${esc(b.handle)}</b><div class="muted tiny">${esc(b.city)}</div><button class="primary" style="margin-top:8px;padding:7px 10px" onclick="toggleFollow('${b.id}')">Obserwuj</button></div>`).join('')}</div>`}
function postCard(p){let a=author(p),comments=p.comments||[],isSaved=state.saved.includes(p.id);return `<article class="card"><div class="posthead row" onclick="${p.author==='player'?"switchPage('profile')":"openBot('"+a.id+"')"}"><img class="avatar" src="${a.avatar}"><div class="col"><b>${esc(a.handle)}</b><span class="muted tiny">${esc(p.location||a.city||'')}</span></div><span class="spacer"></span><button class="iconbtn" onclick="event.stopPropagation()">•••</button></div><img class="postimg" src="${p.img}" loading="lazy"><div class="postactions"><button class="iconbtn" onclick="like('${p.id}')"><svg class="icon" style="${state.likes[p.id]?'fill:#ef476f;stroke:#ef476f':''}"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg></button><button class="iconbtn" onclick="focusComment('${p.id}')"><svg class="icon"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/></svg></button>${p.author!=='player'?`<button class="iconbtn" onclick="openChat('${a.id}')"><svg class="icon"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>`:''}<button class="iconbtn" onclick="sharePost('${p.id}')"><svg class="icon"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button><span class="spacer"></span><button class="iconbtn" onclick="toggleSave('${p.id}')"><svg class="icon" style="${isSaved?'fill:#fff':''}"><path d="M6 3h12v18l-6-4-6 4Z"/></svg></button></div><div class="postbody"><b>${p.likes+(state.likes[p.id]?1:0)} polubień</b><div class="caption"><b>${esc(a.handle)}</b> ${esc(p.cap)}</div>${comments.length?`<div class="muted tiny">Komentarze: ${comments.length}</div>`:''}<div>${comments.slice(-15).map(c=>`<div class="comment" id="comment_${c.id}"><b>${esc(c.user)}</b> ${esc(c.text)} ${p.author==='player'&&c.botId?`<button class="linkbtn tiny" onclick="replyTo('${p.id}','${c.id}')">Odpowiedz</button>`:''}${(c.replies||[]).map(r=>`<div class="reply"><b>${esc(r.user)}</b> ${esc(r.text)}</div>`).join('')}</div>`).join('')}</div><div class="composer" style="margin-top:10px"><input id="ci_${p.id}" placeholder="Dodaj komentarz..."><button class="linkbtn" onclick="addComment('${p.id}')">Wyślij</button></div></div></article>`}
function refreshFeed(add=false){if(add)for(let i=0;i<4;i++){let b=state.bots[Math.floor(Math.random()*state.bots.length)];state.posts.push({id:'n'+Date.now()+i,author:b.id,img:imgSeed(b.handle+Date.now()+i),cap:CAPS[Math.floor(Math.random()*CAPS.length)]+' #'+b.topics[1],location:b.city,likes:5+Math.floor(Math.random()*700),comments:[],created:Date.now()})}let own=state.posts.filter(p=>p.author==='player').sort((a,b)=>b.created-a.created),ai=shuffle(state.posts.filter(p=>p.author!=='player'));feedOrder=ai.map(p=>p.id);if(own[0])feedOrder.splice(2,0,own[0].id);feedLimit=20;save();renderFeed()}
function renderFeed(){let m=new Map(state.posts.map(p=>[p.id,p])),arr=feedOrder.map(id=>m.get(id)).filter(Boolean).slice(0,feedLimit);feed.innerHTML=arr.map(postCard).join('')+(feedLimit<feedOrder.length?`<button class="secondary" style="width:100%;margin-bottom:96px" onclick="feedLimit+=20;renderFeed()">Pokaż więcej</button>`:'')}
function renderExplore(){let q=(exploreSearch.value||'').toLowerCase();let posts=state.posts.filter(p=>{let a=author(p);return !q||p.cap.toLowerCase().includes(q)||(p.location||'').toLowerCase().includes(q)||a.handle.toLowerCase().includes(q)});exploreGrid.innerHTML=shuffle(posts).slice(0,100).map(p=>`<img src="${p.img}" onclick="${p.author==='player'?"openMy('"+p.id+"')":"openBot('"+p.author+"')"}">`).join('')}
function renderMessages(){let q=(peopleSearch.value||'').toLowerCase(),ids=Object.keys(state.messages);messageList.innerHTML=ids.filter(id=>{let b=bot(id);return b&&(!q||b.handle.includes(q)||b.name.toLowerCase().includes(q))}).map(id=>{let b=bot(id),ms=state.messages[id],last=ms[ms.length-1];return `<div class="person" onclick="openChat('${id}')"><img class="avatar" src="${b.avatar}"><div class="grow"><b>@${esc(b.handle)}</b><div class="muted ellipsis">${esc(last?.text||'')}</div></div>${ms.some(m=>m.unread)?'<span style="width:9px;height:9px;background:#6d5dfc;border-radius:50%"></span>':''}</div>`}).join('')||'<p class="muted">Brak rozmów. Napisz do kogoś poniżej.</p>';peopleList.innerHTML=state.bots.filter(b=>!q||b.handle.includes(q)||b.name.toLowerCase().includes(q)||b.city.toLowerCase().includes(q)).slice(0,35).map(b=>`<div class="person"><img class="avatar" src="${b.avatar}" onclick="openBot('${b.id}')"><div class="grow"><b>${esc(b.name)}</b><div class="muted">@${esc(b.handle)} · ${esc(b.city)}</div></div><button class="secondary" onclick="openChat('${b.id}')">Napisz</button></div>`).join('')}
function renderActivity(){activityList.innerHTML=state.activity.slice(0,100).map(a=>`<div class="panel" style="${a.read?'':'border-color:#5d4ca0'}">${esc(a.text)}<div class="muted tiny" style="margin-top:5px">${fmtTime(a.time)}</div></div>`).join('')||'<p class="muted">Jeszcze nic tutaj nie ma.</p>'}
function renderProfile(){let mine=state.posts.filter(p=>p.author==='player').sort((a,b)=>b.created-a.created);profileHead.innerHTML=`<div class="profiletop"><img class="avatar lg" src="${state.player.avatar||imgSeed('me',180)}"><div class="profilemeta"><h2>@${esc(state.player.handle)}</h2><b>${esc(state.player.name)}</b><div class="muted">${esc(state.player.city||'')}</div></div></div><div class="stats"><div><b>${mine.length}</b><div class="muted">posty</div></div><div onclick="showFollowers('followers')"><b>${state.player.followers}</b><div class="muted">followers</div></div><div onclick="showFollowers('following')"><b>${state.player.following}</b><div class="muted">obserwujesz</div></div></div><div class="bio">${esc(state.player.bio)}</div><div class="profilebuttons" style="margin-top:13px"><button class="secondary" onclick="editProfile()">Edytuj profil</button><button class="secondary" onclick="openSettings()">Ustawienia</button></div>`;insights.innerHTML=`<div class="row"><h3 style="margin:0">Insights</h3><span class="spacer"></span><span class="muted tiny">ostatnia aktywność</span></div><div class="metricgrid" style="margin-top:10px"><div class="metric"><b>${state.player.reach}</b>Zasięg</div><div class="metric"><b>${state.player.views}</b>Odwiedziny profilu</div><div class="metric"><b>${Object.keys(state.messages).length}</b>Rozmowy</div><div class="metric"><b>${state.saved.length}</b>Zapisane</div></div>`;myGrid.innerHTML=mine.map(p=>`<img src="${p.img}" onclick="openMy('${p.id}')">`).join('')}

async function publishPost(){let f=postImage.files[0];if(!f)return toast('Wybierz zdjęcie');let loc=postLocation.value.trim(),tags=postTags.value.trim(),cap=(postCaption.value.trim()+(tags?' '+tags:'')).trim(),p={id:'u'+Date.now(),author:'player',img:await fileData(f),cap,location:loc,likes:45+Math.floor(Math.random()*330),comments:[],created:Date.now()};let count=22+Math.floor(Math.random()*28);let usedComments=[];shuffle(state.bots).slice(0,count).forEach((b,i)=>{let txt=contextComment(cap+' '+loc,b,usedComments);usedComments.push(txt);p.comments.push({id:'c'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2),botId:b.id,user:b.handle,text:txt,replies:[]})});let gain=25+Math.floor(Math.random()*105)+Math.floor(count*1.2);state.player.followers+=gain;state.player.reach+=700+Math.floor(Math.random()*5200);state.player.views+=70+Math.floor(Math.random()*800);state.posts.push(p);state.activity.unshift({time:Date.now(),read:false,text:`Nowy post: ${p.likes} polubień, ${count} komentarzy i +${gain} followersów.`});if(shareStoryToggle.classList.contains('on'))state.stories.push({id:'auto'+Date.now(),img:p.img,cap:p.cap,created:Date.now(),views:100+Math.floor(Math.random()*800),replies:[]});await save();setTimeout(()=>maybeBotInitiates('post',1+Math.floor(Math.random()*2)),1400);postImage.value='';postCaption.value='';postLocation.value='';postTags.value='';postPreview.innerHTML=`<div><h3>Wybierz zdjęcie</h3><span class="muted">Dotknij, aby wybrać z telefonu</span></div>`;shareStoryToggle.classList.remove('on');refreshFeed(false);renderProfile();switchPage('profile');toast('Post opublikowany')}
async function publishStory(){let f=storyImage.files[0];if(!f)return toast('Wybierz zdjęcie');let s={id:'s'+Date.now(),img:await fileData(f),cap:storyCaption.value.trim(),created:Date.now(),views:80+Math.floor(Math.random()*900),replies:[]},n=6+Math.floor(Math.random()*12);shuffle(state.bots).slice(0,n).forEach(b=>{let txt=contextComment(s.cap||'relacja',b);s.replies.push({botId:b.id,text:txt});state.messages[b.id]=state.messages[b.id]||[];state.messages[b.id].push({from:'bot',text:'Odpowiedź na Twoją relację: '+txt,time:Date.now()})});state.stories.push(s);state.activity.unshift({time:Date.now(),read:false,text:`Relacja: ${s.views} wyświetleń i ${n} odpowiedzi w DM.`});await save();setTimeout(()=>maybeBotInitiates('story',1),1200);renderMessages();renderActivity();toast('Relacja dodana')}
function focusComment(id){setTimeout(()=>document.getElementById('ci_'+id)?.focus(),30)}
function like(id){state.likes[id]=!state.likes[id];save();renderFeed()}
function toggleSave(id){let i=state.saved.indexOf(id);if(i>=0)state.saved.splice(i,1);else state.saved.push(id);save();renderFeed();toast(i>=0?'Usunięto z zapisanych':'Zapisano post')}
function addComment(id){let i=document.getElementById('ci_'+id),t=i.value.trim();if(!t)return;let p=state.posts.find(x=>x.id===id);p.comments.push({id:'self'+Date.now(),user:state.player.handle,text:t,replies:[]});i.value='';save();renderFeed()}
function replyTo(pid,cid){let p=state.posts.find(x=>x.id===pid),c=p.comments.find(x=>x.id===cid);if(!c)return;modalBox.innerHTML=`<div class="row"><h3 style="margin:0">Odpowiedź</h3><span class="spacer"></span><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="panel" style="margin-top:10px"><b>@${esc(c.user)}</b><div>${esc(c.text)}</div></div><textarea id="replyInput" rows="3" placeholder="Napisz odpowiedź..."></textarea><button class="primary" style="width:100%;margin-top:10px" onclick="saveReply('${pid}','${cid}')">Wyślij</button>`;modal.classList.add('show')}
async function saveReply(pid,cid){let t=replyInput.value.trim();if(!t)return;let p=state.posts.find(x=>x.id===pid),c=p.comments.find(x=>x.id===cid),b=bot(c.botId);c.replies.push({user:state.player.handle,text:t});await save();closeModal();renderFeed();setTimeout(async()=>{if(b&&Math.random()<.75){c.replies.push({user:b.handle,text:dmReply(b,t)});await save();renderFeed();renderProfile()}},650)}
function openMy(id){let p=state.posts.find(x=>x.id===id);modalBox.innerHTML=`<div class="row"><b>Twój post</b><span class="spacer"></span><button class="iconbtn" onclick="editPost('${id}')">✎</button><button class="iconbtn" onclick="deletePost('${id}')">🗑</button><button class="iconbtn" onclick="closeModal()">✕</button></div><div style="margin-top:10px">${postCard(p)}</div>`;modal.classList.add('show')}
function editPost(id){let p=state.posts.find(x=>x.id===id);modalBox.innerHTML=`<h3>Edytuj post</h3><textarea id="editCap" rows="4">${esc(p.cap)}</textarea><input id="editLoc" type="text" value="${esc(p.location||'')}" placeholder="Lokalizacja" style="margin-top:8px"><button class="primary" style="width:100%;margin-top:10px" onclick="savePostEdit('${id}')">Zapisz zmiany</button>`}
async function savePostEdit(id){let p=state.posts.find(x=>x.id===id);p.cap=editCap.value.trim();p.location=editLoc.value.trim();await save();closeModal();renderProfile();refreshFeed(false);toast('Post zaktualizowany')}
async function deletePost(id){if(!confirm('Usunąć ten post?'))return;state.posts=state.posts.filter(p=>p.id!==id);state.saved=state.saved.filter(x=>x!==id);await save();closeModal();renderProfile();refreshFeed(false);toast('Post usunięty')}
function openBot(id){let b=bot(id),f=state.followingIds.includes(id);modalBox.innerHTML=`<div class="profiletop"><img class="avatar lg" src="${b.avatar}"><div class="profilemeta"><h2>${esc(b.name)}</h2><div>@${esc(b.handle)}</div><div class="muted">${esc(b.city)}</div></div></div><div class="panel" style="margin-top:12px">${esc(b.bio)}<br><b>${b.followers} followers</b><div class="muted tiny" style="margin-top:7px">Relacja: ${relationLabel(b)} · chemia ${b.chemistry||0}%</div></div><div class="profilebuttons"><button class="primary" onclick="openChat('${id}')">Wiadomość</button><button class="secondary" onclick="toggleFollow('${id}')">${f?'Obserwujesz':'Obserwuj'}</button></div><div class="profilebuttons" style="margin-top:8px"><button class="secondary" onclick="toggleMute('${id}')">${state.mutedIds.includes(id)?'Włącz':'Wycisz'}</button><button class="secondary" onclick="toggleBlock('${id}')">${state.blockedIds.includes(id)?'Odblokuj':'Zablokuj'}</button></div>`;modal.classList.add('show')}
async function toggleFollow(id){let i=state.followingIds.indexOf(id);if(i>=0){state.followingIds.splice(i,1);state.player.following--}else{state.followingIds.push(id);state.player.following++;state.activity.unshift({time:Date.now(),read:false,text:`Zacząłeś/aś obserwować @${bot(id).handle}.`})}await save();renderSuggestions();renderProfile();openBot(id)}
function openChat(id){activeChat=id;let b=bot(id);state.messages[id]=state.messages[id]||[];state.messages[id].forEach(m=>m.unread=false);let ms=state.messages[id];save();modalBox.innerHTML=`<div class="row"><img class="avatar" src="${b.avatar}"><div><b>${esc(b.name)}</b><div class="muted tiny">@${esc(b.handle)} · ${esc(b.city)}</div></div><span class="spacer"></span><button class="iconbtn" onclick="closeModal()">✕</button></div><div id="chatlog" class="chatlog">${ms.map(m=>`<div class="bubble ${m.from==='me'?'me':'bot'}">${esc(m.text)}</div>`).join('')||'<div class="muted">Napisz pierwszą wiadomość.</div>'}</div><div class="composer"><input id="chatInput" placeholder="Wiadomość..." onkeydown="if(event.key==='Enter')sendChat()"><button class="iconbtn" onclick="sendChat()"><svg class="icon"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div>`;modal.classList.add('show');setTimeout(()=>{let c=document.getElementById('chatlog');if(c)c.scrollTop=c.scrollHeight},30)}
async function sendChat(){let t=chatInput.value.trim();if(!t)return;let id=activeChat,b=bot(id);state.messages[id].push({from:'me',text:t,time:Date.now()});b.affinity=Math.min(100,b.affinity+1);if(/[😏😘❤️🔥]|podob|spotk|pocał|hot/i.test(t))b.chemistry=Math.min(100,(b.chemistry||0)+2);await save();openChat(id);let cl=document.getElementById('chatlog');if(cl){cl.insertAdjacentHTML('beforeend','<div class="typing"><i></i><i></i><i></i></div>');cl.scrollTop=cl.scrollHeight}setTimeout(async()=>{state.messages[id].push({from:'bot',text:dmReply(b,t),time:Date.now(),unread:activeChat!==id});await save();if(activeChat===id)openChat(id);renderMessages()},700+Math.floor(Math.random()*800))}
function openStory(id){let b=bot(id);modalBox.innerHTML=`<div class="row"><img class="avatar" src="${b.avatar}"><b>@${esc(b.handle)}</b><span class="spacer"></span><button class="iconbtn" onclick="closeModal()">✕</button></div><img class="storyview" src="${imgSeed('story_'+id+'_'+Math.floor(Date.now()/1800000))}"><div class="row" style="justify-content:center;margin-top:10px"><button class="pill" onclick="reactStory('${id}','🔥')">🔥</button><button class="pill" onclick="reactStory('${id}','😍')">😍</button><button class="pill" onclick="reactStory('${id}','😂')">😂</button><button class="pill" onclick="reactStory('${id}','😏')">😏</button></div><div class="composer" style="margin-top:10px"><input id="sr" placeholder="Odpowiedz na relację..."><button class="iconbtn" onclick="storyReply('${id}')"><svg class="icon"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div>`;modal.classList.add('show')}
async function storyReply(id){let t=sr.value.trim();if(!t)return;state.messages[id]=state.messages[id]||[];state.messages[id].push({from:'me',text:'Odpowiedź na relację: '+t,time:Date.now()});await save();closeModal();setTimeout(async()=>{let b=bot(id);state.messages[id].push({from:'bot',text:dmReply(b,t),time:Date.now()});await save();renderMessages()},500);toast('Wysłano do DM')}
function editProfile(){modalBox.innerHTML=`<div class="row"><h3 style="margin:0">Edytuj profil</h3><span class="spacer"></span><button class="iconbtn" onclick="closeModal()">✕</button></div><label class="formlabel">Zdjęcie profilowe</label><input id="epAvatar" type="file" accept="image/*"><label class="formlabel">Nazwa</label><input id="epName" type="text" value="${esc(state.player.name)}"><label class="formlabel">Login</label><input id="epHandle" type="text" value="${esc(state.player.handle)}"><label class="formlabel">Miasto</label><input id="epCity" type="text" value="${esc(state.player.city)}"><label class="formlabel">Bio</label><textarea id="epBio" rows="4">${esc(state.player.bio)}</textarea><button class="primary" style="width:100%;margin-top:12px" onclick="saveProfile()">Zapisz profil</button>`;modal.classList.add('show')}
async function saveProfile(){let h=epHandle.value.trim().replace(/^@/,'').replace(/\s+/g,'');if(!epName.value.trim()||!h)return toast('Nazwa i login są wymagane');state.player.name=epName.value.trim();state.player.handle=h;state.player.city=epCity.value.trim();state.player.bio=epBio.value.trim();if(epAvatar.files[0])state.player.avatar=await fileData(epAvatar.files[0],500);await save();closeModal();renderAll();toast('Profil zapisany')}
function openSettings(){modalBox.innerHTML=`<div class="row"><h3 style="margin:0">Ustawienia</h3><span class="spacer"></span><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="settingsrow"><div><b>Konto prywatne</b><div class="muted tiny">Symulowane ustawienie profilu</div></div><div class="switch ${state.player.private?'on':''}" onclick="togglePrivate(this)"></div></div><div class="settingsrow" onclick="showSaved()"><b>Zapisane posty</b><span class="spacer"></span><span class="muted">${state.saved.length}</span></div><div class="settingsrow" onclick="editProfile()"><b>Edytuj profil</b><span class="spacer">›</span></div><div class="settingsrow" onclick="exportData()"><b>Eksport danych</b><span class="spacer">›</span></div><div class="settingsrow" onclick="resetApp()"><b style="color:#ff7474">Reset aplikacji</b></div>`;modal.classList.add('show')}
async function togglePrivate(el){state.player.private=!state.player.private;el.classList.toggle('on',state.player.private);await save()}
function showSaved(){let posts=state.saved.map(id=>state.posts.find(p=>p.id===id)).filter(Boolean);modalBox.innerHTML=`<div class="row"><h3 style="margin:0">Zapisane</h3><span class="spacer"></span><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="grid" style="margin-top:12px">${posts.map(p=>`<img src="${p.img}">`).join('')||'<span class="muted">Brak zapisanych postów.</span>'}</div>`}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aigram-backup.json';a.click();URL.revokeObjectURL(a.href)}
async function resetApp(){if(!confirm('To usunie profil, posty, DM i ustawienia z tej wersji aplikacji. Kontynuować?'))return;state=blank();seedBots();seedPosts();await save();location.reload()}
function closeModal(){modal.classList.remove('show');activeChat=null}
function switchPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===id));if(id==='explore')renderExplore();if(id==='reels')renderReels();if(id==='messages')renderMessages();if(id==='profile')renderProfile();if(id==='activity'){markActivityRead();renderActivity()}}
function renderAll(){renderStories();renderSuggestions();refreshFeed(false);renderExplore();renderReels();renderMessages();renderProfile();renderActivity();updateActivityDot()}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));modal.onclick=e=>{if(e.target===modal)closeModal()};
(async()=>{await load();if(!state.initialized)onboard.classList.add('show');renderAll();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();setInterval(()=>state?.initialized&&save(),12000);setInterval(socialTick,30000);document.addEventListener('visibilitychange',()=>document.hidden&&save());
</script>
</body></html>
