<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIgram Private</title>
<style>
:root{--bg:#0b0d10;--card:#12151a;--muted:#89919e;--line:#242a33;--fg:#f5f7fa;--accent:#4f8cff;--danger:#ff5d6c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea{font:inherit}.app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:82px}.top{position:sticky;top:0;z-index:10;background:rgba(11,13,16,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:22px}.pill{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 12px}.page{display:none;padding:12px}.page.active{display:block}.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0b0d10;border-top:1px solid var(--line);display:flex;justify-content:center}.navin{width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;border:0;color:var(--muted);padding:12px 4px}.nav button.active{color:var(--fg)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}.head{display:flex;align-items:center;gap:10px;padding:11px}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#222}.who{flex:1}.who b{display:block}.who small{color:var(--muted)}.postimg{width:100%;aspect-ratio:1/1;object-fit:cover;background:#151922}.actions{display:flex;gap:10px;padding:9px 11px}.actions button{background:none;border:0;color:var(--fg);font-size:23px}.body{padding:0 12px 12px}.muted{color:var(--muted)}.comments{margin-top:8px}.comment{margin:7px 0}.reply{margin-left:18px;color:#cfd5df}.commentbox{display:flex;gap:8px;margin-top:10px}.commentbox input{flex:1;background:#0b0d10;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px}.primary,.secondary{border:0;border-radius:12px;padding:10px 14px}.primary{background:var(--accent);color:#fff}.secondary{background:#1b2028;color:var(--fg);border:1px solid var(--line)}.composer{padding:14px}.composer textarea,.composer input{width:100%;background:#0b0d10;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px;margin:6px 0}.stories{display:flex;gap:10px;overflow:auto;padding:4px 0 12px}.story{min-width:76px;text-align:center}.story img{width:66px;height:66px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);padding:2px}.story span{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;background:#171b22}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}.modal.show{display:flex}.modalbox{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.modalbox input,.modalbox textarea{width:100%;background:#0b0d10;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px;margin:6px 0}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#1d232c;color:#fff;padding:10px 14px;border-radius:999px;z-index:100;display:none}.row{display:flex;gap:8px;align-items:center}.sp{flex:1}.storyview{width:100%;max-height:65vh;object-fit:contain;border-radius:14px;background:#000}.badge{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">AIgram</div><button class="pill" onclick="refreshFeed(true)">↻ Odśwież</button></header>
  <main>
    <section id="home" class="page active"><div id="stories" class="stories"></div><div id="feed"></div></section>
    <section id="create" class="page"><div class="card composer"><h3>Nowy post</h3><input id="postImage" type="file" accept="image/*"><textarea id="postCaption" rows="3" placeholder="Napisz opis..."></textarea><button class="primary" onclick="publishPost()">Opublikuj</button></div><div class="card composer"><h3>Nowa relacja</h3><input id="storyImage" type="file" accept="image/*"><button class="primary" onclick="publishStory()">Dodaj relację</button></div></section>
    <section id="activity" class="page"><h3>Aktywność</h3><div id="activityList"></div></section>
    <section id="messages" class="page"><h3>Wiadomości</h3><div id="messageList"></div></section>
    <section id="profile" class="page"><div id="profileHead"></div><h3>Moje posty</h3><div id="myGrid" class="grid"></div></section>
  </main>
</div>
<nav class="nav"><div class="navin"><button class="active" data-page="home">⌂<br><small>Home</small></button><button data-page="create">＋<br><small>Dodaj</small></button><button data-page="activity">♡<br><small>Aktywność</small></button><button data-page="messages">✉<br><small>DM</small></button><button data-page="profile">▦<br><small>Moje posty</small></button></div></nav>
<div id="modal" class="modal"><div id="modalBox" class="modalbox"></div></div><div id="toast" class="toast"></div>
<script>
const DB='AIgramGitHubDB', STORE='state', KEY='main';
const NAMES=['Lena','Mila','Noah','Aya','Zoe','Nina','Leo','Sofia','Maya','Emil','Clara','Luca','Emma','Max','Nora','Theo','Julia','Oskar','Amelia','Finn','Elsa','Miko','Laura','Alex','Sara','Kai','Mia','Ben','Lina','Eli'];
const CITIES=['Berlin','Warszawa','Amsterdam','London','Tokyo','Barcelona','Rome','Prague','Vienna','Paris','Lisbon','Oslo'];
const CAPS=['Dzisiaj trochę wolniej.','Małe rzeczy robią klimat.','Ten dzień był potrzebny.','W drodze.','Bez planu, ale dobrze wyszło.','Jeszcze jedno z dzisiaj.','Tu zostaję na chwilę.','Dobry vibe.'];
const COMMENTS=['Ale klimat 🔥','Mega ujęcie.','Okej, robi wrażenie 👀','Świetne zdjęcie.','No dobra 😏','To siadło.','Gdzie to było?','Pięknie wygląda.','Ten post jest naprawdę dobry.','🔥🔥🔥','Uwielbiam ten vibe.','Dobra, zostawiam like.'];
let state=null, feedOrder=[], feedLimit=24;
function blankState(){return{version:1,player:{name:'Jakub',handle:'jakub',followers:12,following:0,views:0},bots:[],posts:[],stories:[],activity:[],messages:{},likes:{},createdAt:Date.now()}}
function botAvatar(name,i){return `https://picsum.photos/seed/${encodeURIComponent(name+i)}/160/160`}
function postImage(seed){return `https://picsum.photos/seed/${encodeURIComponent(seed)}/900/900`}
function seedBots(){if(state.bots.length)return;for(let i=0;i<120;i++){let name=NAMES[i%NAMES.length]+' '+String.fromCharCode(65+(i%26))+'.';state.bots.push({id:'b'+i,name,handle:(name.toLowerCase().replace(/[^a-z0-9]+/g,'')+i),city:CITIES[i%CITIES.length],avatar:botAvatar(name,i),followers:100+Math.floor(Math.random()*18000)})}}
function seedPosts(){let ai=state.posts.filter(p=>p.author!=='player').length;for(let i=ai;i<160;i++){let b=state.bots[Math.floor(Math.random()*state.bots.length)];state.posts.push({id:'p_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2),author:b.id,img:postImage(b.handle+'_'+i+'_'+Math.random()),cap:CAPS[Math.floor(Math.random()*CAPS.length)],likes:10+Math.floor(Math.random()*1200),comments:[],created:Date.now()-Math.floor(Math.random()*1000*60*60*72)})}}
async function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function saveState(){try{let db=await openDB();await new Promise((res,rej)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,KEY);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});try{localStorage.setItem('aigram_backup',JSON.stringify({...state,posts:state.posts.map(p=>({...p,img:(p.author==='player'?'':p.img)}))}))}catch(e){}return true}catch(e){console.error(e);return false}}
async function loadState(){try{let db=await openDB();let val=await new Promise((res,rej)=>{let tx=db.transaction(STORE,'readonly');let r=tx.objectStore(STORE).get(KEY);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});state=val||blankState()}catch(e){try{state=JSON.parse(localStorage.getItem('aigram_backup'))||blankState()}catch(_){state=blankState()}}seedBots();seedPosts();await saveState()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function bot(id){return state.bots.find(b=>b.id===id)}
function author(p){return p.author==='player'?{id:'player',handle:state.player.handle,name:state.player.name,city:'',avatar:'https://picsum.photos/seed/myavatar/160/160'}:bot(p.author)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function refreshFeed(addNew=false){if(addNew){for(let i=0;i<2+Math.floor(Math.random()*3);i++){let b=state.bots[Math.floor(Math.random()*state.bots.length)];state.posts.push({id:'p_'+Date.now()+'_'+Math.random(),author:b.id,img:postImage(b.handle+'_'+Date.now()+'_'+i),cap:CAPS[Math.floor(Math.random()*CAPS.length)],likes:5+Math.floor(Math.random()*500),comments:[],created:Date.now()})}saveState()}let own=state.posts.filter(p=>p.author==='player').sort((a,b)=>b.created-a.created);let ai=shuffle(state.posts.filter(p=>p.author!=='player'));feedOrder=ai.map(p=>p.id);if(own[0])feedOrder.splice(2,0,own[0].id);feedLimit=24;renderFeed();if(addNew)toast('Feed odświeżony')}
function postCard(p){let a=author(p), cs=p.comments||[];return `<article class="card"><div class="head"><img class="avatar" src="${a.avatar}"><div class="who"><b>${esc(a.handle)}</b><small>${esc(a.city||'')}</small></div><span class="badge">${p.author==='player'?'TY':'AI'}</span></div><img class="postimg" src="${p.img}" loading="lazy"><div class="actions"><button onclick="likePost('${p.id}')">${state.likes[p.id]?'♥':'♡'}</button><button onclick="focusComment('${p.id}')">💬</button></div><div class="body"><b>${p.likes+(state.likes[p.id]?1:0)} polubień</b><div><b>${esc(a.handle)}</b> ${esc(p.cap)}</div><div class="comments">${cs.slice(-8).map((c,idx)=>`<div class="comment"><b>${esc(c.user)}</b> ${esc(c.text)} ${p.author==='player'&&c.user!==state.player.handle?`<button class="secondary" onclick="replyPrompt('${p.id}',${idx})">Odpowiedz</button>`:''}${c.reply?`<div class="reply"><b>${esc(state.player.handle)}</b> ${esc(c.reply)}</div>`:''}</div>`).join('')}</div><div class="commentbox"><input id="c_${p.id}" placeholder="Dodaj komentarz..."><button class="secondary" onclick="addComment('${p.id}')">Wyślij</button></div></div></article>`}
function renderFeed(){let map=new Map(state.posts.map(p=>[p.id,p]));let arr=feedOrder.map(id=>map.get(id)).filter(Boolean).slice(0,feedLimit);document.getElementById('feed').innerHTML=`<div class="row" style="padding:4px 0 12px"><div><b>Dla Ciebie</b><div class="muted">Inny układ przy każdym odświeżeniu</div></div><span class="sp"></span><button class="secondary" onclick="refreshFeed(true)">↻</button></div>${arr.map(postCard).join('')}${feedLimit<feedOrder.length?`<button class="secondary" style="width:100%;margin-bottom:90px" onclick="feedLimit+=24;renderFeed()">Pokaż więcej</button>`:''}`}
function renderStories(){let ai=state.bots.slice(0,22).map(b=>`<div class="story" onclick="openStory('${b.id}')"><img src="${b.avatar}"><span>${esc(b.handle)}</span></div>`).join('');document.getElementById('stories').innerHTML=`<div class="story" onclick="switchPage('create')"><img src="https://picsum.photos/seed/myavatar/160/160"><span>Twoja relacja</span></div>`+ai}
function renderProfile(){let mine=state.posts.filter(p=>p.author==='player').sort((a,b)=>b.created-a.created);document.getElementById('profileHead').innerHTML=`<h2>@${esc(state.player.handle)}</h2><div class="stats"><div class="stat"><b>${mine.length}</b><div class="muted">posty</div></div><div class="stat"><b>${state.player.followers}</b><div class="muted">followers</div></div><div class="stat"><b>${state.player.views}</b><div class="muted">wyświetlenia</div></div></div>`;document.getElementById('myGrid').innerHTML=mine.map(p=>`<img src="${p.img}" onclick="openMyPost('${p.id}')">`).join('')||'<div class="muted">Nie masz jeszcze postów.</div>'}
function renderActivity(){document.getElementById('activityList').innerHTML=(state.activity||[]).slice(0,80).map(x=>`<div class="card composer">${esc(x.text)}<div class="muted">${new Date(x.time).toLocaleString()}</div></div>`).join('')||'<div class="muted">Brak aktywności.</div>'}
function renderMessages(){document.getElementById('messageList').innerHTML=Object.keys(state.messages).slice(0,40).map(id=>{let b=bot(id),m=state.messages[id];return `<div class="card composer"><b>@${esc(b?.handle||id)}</b><div class="muted">${esc(m[m.length-1]?.text||'')}</div></div>`}).join('')||'<div class="muted">Brak wiadomości.</div>'}
async function fileToData(file){return new Promise((res,rej)=>{let img=new Image(),r=new FileReader();r.onload=e=>{img.onload=()=>{let max=1080,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};img.onerror=rej;img.src=e.target.result};r.onerror=rej;r.readAsDataURL(file)})}
async function publishPost(){let f=document.getElementById('postImage').files[0];if(!f){toast('Wybierz zdjęcie');return}let img=await fileToData(f),cap=document.getElementById('postCaption').value.trim();let p={id:'u_'+Date.now(),author:'player',img,cap,likes:0,comments:[],created:Date.now()};state.posts.push(p);let gain=18+Math.floor(Math.random()*85);state.player.followers+=gain;state.player.views+=120+Math.floor(Math.random()*1500);let count=9+Math.floor(Math.random()*13);for(let i=0;i<count;i++){let b=state.bots[Math.floor(Math.random()*state.bots.length)];p.comments.push({user:b.handle,text:COMMENTS[Math.floor(Math.random()*COMMENTS.length)],reply:''})}p.likes=30+Math.floor(Math.random()*450);state.activity.unshift({time:Date.now(),text:`Nowy post: +${gain} followersów, ${count} komentarzy.`});await saveState();document.getElementById('postImage').value='';document.getElementById('postCaption').value='';refreshFeed(false);renderProfile();renderActivity();switchPage('profile');toast('Post zapisany')}
async function publishStory(){let f=document.getElementById('storyImage').files[0];if(!f){toast('Wybierz zdjęcie');return}let img=await fileToData(f),s={id:'s_'+Date.now(),author:'player',img,created:Date.now(),views:20+Math.floor(Math.random()*220),replies:[]};let n=2+Math.floor(Math.random()*6);for(let i=0;i<n;i++){let b=state.bots[Math.floor(Math.random()*state.bots.length)],txt=['🔥','😍','Mega relacja','Gdzie jesteś?','Okej 👀','Dobre 😏'][Math.floor(Math.random()*6)];s.replies.push({bot:b.id,text:txt});state.messages[b.id]=state.messages[b.id]||[];state.messages[b.id].push({from:'bot',text:'Odpowiedź na relację: '+txt,time:Date.now()})}state.stories.push(s);state.activity.unshift({time:Date.now(),text:`Relacja: ${s.views} wyświetleń, ${n} odpowiedzi.`});await saveState();renderActivity();renderMessages();toast('Relacja zapisana')}
function likePost(id){state.likes[id]=!state.likes[id];saveState();renderFeed()}
function focusComment(id){document.getElementById('c_'+id)?.focus()}
function addComment(id){let inp=document.getElementById('c_'+id),txt=inp?.value.trim();if(!txt)return;let p=state.posts.find(x=>x.id===id);p.comments=p.comments||[];p.comments.push({user:state.player.handle,text:txt,reply:''});inp.value='';saveState();renderFeed()}
function replyPrompt(pid,idx){let p=state.posts.find(x=>x.id===pid),c=p?.comments?.[idx];if(!c)return;document.getElementById('modalBox').innerHTML=`<h3>Odpowiedz @${esc(c.user)}</h3><textarea id="replyText" rows="3"></textarea><div class="row"><button class="secondary" onclick="closeModal()">Anuluj</button><span class="sp"></span><button class="primary" onclick="saveReply('${pid}',${idx})">Wyślij</button></div>`;document.getElementById('modal').classList.add('show')}
function saveReply(pid,idx){let txt=document.getElementById('replyText').value.trim();if(!txt)return;let p=state.posts.find(x=>x.id===pid);p.comments[idx].reply=txt;saveState();closeModal();renderFeed();openMyPost(pid)}
function openMyPost(id){let p=state.posts.find(x=>x.id===id);if(!p)return;document.getElementById('modalBox').innerHTML=`<button class="secondary" onclick="closeModal()">← Zamknij</button>${postCard(p)}`;document.getElementById('modal').classList.add('show')}
function openStory(id){let b=bot(id),img=postImage('story_'+id+'_'+Math.floor(Date.now()/3600000));document.getElementById('modalBox').innerHTML=`<div class="row"><img class="avatar" src="${b.avatar}"><b>@${esc(b.handle)}</b><span class="sp"></span><button class="secondary" onclick="closeModal()">×</button></div><img class="storyview" src="${img}"><div class="commentbox"><input id="storyReply" placeholder="Odpowiedz na relację..."><button class="primary" onclick="sendStoryReply('${id}')">Wyślij</button></div>`;document.getElementById('modal').classList.add('show')}
function sendStoryReply(id){let txt=document.getElementById('storyReply').value.trim();if(!txt)return;state.messages[id]=state.messages[id]||[];state.messages[id].push({from:'me',text:txt,time:Date.now()});let b=bot(id);setTimeout(()=>{state.messages[id].push({from:'bot',text:['Haha 😄','No nieźle 👀','Dzięki ❤️','Ty też potrafisz zwrócić uwagę 😏'][Math.floor(Math.random()*4)],time:Date.now()});saveState();renderMessages()},350);saveState();closeModal();toast('Wysłano')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display='none',1800)}
function switchPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));if(id==='profile')renderProfile();if(id==='activity')renderActivity();if(id==='messages')renderMessages()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
(async()=>{await loadState();renderStories();refreshFeed(false);renderProfile();renderActivity();renderMessages()})();
window.addEventListener('beforeunload',()=>saveState());document.addEventListener('visibilitychange',()=>{if(document.hidden)saveState()});
</script>
</body></html>
